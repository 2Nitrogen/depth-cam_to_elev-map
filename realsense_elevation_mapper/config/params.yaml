local_elevation_mapper_node:
  ros__parameters:
    input_cloud_topic: /camera/camera/depth/color/points
    accumulated_cloud_topic: /local_elevation_map/accumulated_points
    elevation_cloud_topic: /local_elevation_map/points

    target_frame: base_link
    k_frames: 5

    map_length_x: 2.0
    map_length_y: 2.0
    resolution: 0.02

    # x_min: 0.0
    # x_max: 2.0
    # y_min: -1.0
    # y_max: 1.0
    # z_min: -0.5
    # z_max: 1.0

    publish_accumulated_cloud: true
    publish_elevation_cloud: true

    # Currently false for ROI-bounds inspection (see the accumulated cloud
    # in RViz, decide proper x/y/z bounds, then re-enable). Production
    # should be true.
    enable_roi_crop: false

    min_points_per_cell: 1
    cloud_queue_size: 5
    tf_timeout_sec: 0.1
    # When true, use latest available TF instead of cloud's header.stamp.
    # Required when bag stamps and /clock are mismatched (common with rosbags
    # recorded in RealSense sensor-time mode). Set to false for live cameras
    # with consistent timestamps when accurate per-frame TF interpolation matters.
    use_latest_tf: true
