local_elevation_mapper_node:
  ros__parameters:
    input_cloud_topic: /camera/camera/depth/color/points
    accumulated_cloud_topic: /local_elevation_map/accumulated_points
    elevation_cloud_topic: /local_elevation_map/points

    # target_frame: gravity-aligned global frame the elevation map lives in.
    # The state_estimator publishes odom->base_link with roll/pitch from
    # the IMU and translation=[0,0,0]; this means the map's z is world-up
    # even when the robot body tilts.
    target_frame: odom
    # track_point_frame: body frame the ego-centric window follows. The
    # grid extent is centered on this frame's XY position in target_frame.
    track_point_frame: base_link
    k_frames: 5

    resolution: 0.02

    # Spherical range cutoff (m). The raw camera-frame cloud is cropped
    # to a sensor-centered ball of this radius BEFORE the TF transform.
    # RealSense depth noise scales with depth² so far points are mostly
    # noise; the sphere cull also fixes the grid extent at
    # [-R, R] × [-R, R] shifted by the track-point translation. Set to
    # 0 (or negative) to disable both the cull and the fixed grid extent
    # — the mapper then runs in inspection mode (grid auto-fits each
    # frame).
    max_distance_m: 3.5

    publish_accumulated_cloud: true
    publish_elevation_cloud: true

    # Cells with fewer than this many *temporal* updates are dropped from
    # the published elevation cloud. Each update corresponds to one
    # buffered frame contributing this cell.
    min_points_per_cell: 1
    cloud_queue_size: 5
    tf_timeout_sec: 0.1
    # When true, use latest available TF instead of cloud's header.stamp.
    # Required when bag stamps and /clock are mismatched (common with rosbags
    # recorded in RealSense sensor-time mode). Set to false for live cameras
    # with consistent timestamps when accurate per-frame TF interpolation matters.
    use_latest_tf: true

    # --- Per-cell Kalman fusion ---
    # See FusionParams in elevation_grid.hpp. Variances are in m^2.
    # Fusion is always per-frame per-cell: each incoming frame is binned
    # into one CellMeasurement per occupied cell (mean z, mean R of the
    # raw points in that cell), then each buffered frame contributes at
    # most one Kalman update per cell during temporal fusion.

    # Per-point measurement variance R model.
    #   constant      : R = sensor_variance (legacy behavior — every
    #                   point gets the same measurement variance).
    #   depth_squared : R = sensor_noise_factor * depth^2 (R grows
    #                   with range, more weight to near-camera points).
    measurement_variance_model: depth_squared

    # Only used when measurement_variance_model = depth_squared.
    #   raw_z      : depth = raw sensor-frame point.z (RealSense optical
    #                convention — z is the optical depth axis).
    #   range_norm : depth = sqrt(x^2 + y^2 + z^2) in raw sensor frame.
    depth_source: raw_z

    sensor_variance: 0.0009          # (3 cm)^2 — constant R, also fallback for bad depth
    sensor_noise_factor: 0.0009      # depth_squared coefficient; at depth=1m gives R=0.0009 (sigma=3cm)

    # Clamp applied to measurement variance R BEFORE each Kalman update.
    # Distinct from min_variance / max_variance below, which clamp the
    # map estimate variance P. Keep min < max.
    min_measurement_variance: 0.000009
    max_measurement_variance: 0.01

    # If true, the Mahalanobis gate uses innovation variance (P + R).
    # If false, only P is used in the denominator (legacy behavior when
    # R was constant).
    # With depth_squared mode active, true is the consistent choice:
    # far-range measurements have large R and a P-only gate would reject
    # them too aggressively.
    mahalanobis_use_measurement_variance: true

    # If true, log per-callback min/mean/max of the per-point measurement
    # variance over the accumulated buffer (throttled to ~1 Hz).
    debug_measurement_variance: false

    # Map estimate variance P clamp (applied after every fusion step).
    min_variance: 0.000009           # (3 mm)^2 — floor; keeps cells correctable
    max_variance: 0.01               # (10 cm)^2 — ceiling / sanity rail

    mahalanobis_threshold: 2.5       # outlier gate (sigma units)
    multi_height_noise: 0.0000009    # variance bump on outlier rejection

    # Continuous cleanup: rebuild the grid every callback so the map only
    # reflects the current accumulated buffer. Right default while the
    # robot is stationary (no incremental motion to integrate).
    # Switch to false once real translation is published; then stale cells
    # are aged out by max_age_sec instead.
    # NOTE: this flag only matters when sphere crop is active
    # (max_distance_m > 0). In inspection mode (max_distance_m <= 0)
    # the grid extent auto-fits to the cloud each frame, so the layers
    # are reset on every callback regardless of this setting.
    enable_continuous_cleanup: true
    max_age_sec: 2.0
