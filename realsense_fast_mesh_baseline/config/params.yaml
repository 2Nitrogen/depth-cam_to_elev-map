local_fast_mesh_node:
  ros__parameters:
    # ---- Topics ----
    # We subscribe to the raw depth Image + CameraInfo (NOT the
    # wrapper's PointCloud2 topic) and reconstruct the organized cloud
    # ourselves. This bypasses the wrapper's `pointcloud.ordered_pc`
    # flag — many bags were recorded with that false, producing a
    # NaN-stripped / unorganized PointCloud2 that the PCL organized
    # algorithms cannot consume.
    depth_image_topic:        /camera/camera/depth/image_rect_raw
    camera_info_topic:        /camera/camera/depth/camera_info
    accumulated_cloud_topic:  /local_fast_mesh/accumulated_cloud

    # ---- Frames ----
    # target_frame: mapping frame the accumulated cloud is published in.
    # state_estimator publishes odom->base_link with roll/pitch from the
    # IMU and translation=[0,0,0], so the cloud's z stays gravity-up
    # even when the robot tilts.
    target_frame:             odom

    # ---- Timing / TF ----
    tf_timeout_sec:           0.1
    # When true, use latest available TF instead of msg->header.stamp.
    # Required when bag stamps and /clock are mismatched (RealSense
    # sensor-time bags).
    use_latest_tf:            true
    cloud_queue_size:         5

    # ---- Range cutoff (spherical) ----
    # Drop points whose distance from the camera origin exceeds
    # max_distance_m. RealSense depth noise scales with depth², so far
    # points are mostly noise. Set to 0 (or negative) to disable.
    max_distance_m:           3.5

    # ---- Pixel stride (cloud downsampling) ----
    # Take every Nth pixel along both axes when reconstructing the
    # organized cloud. stride=N gives N²-fold vertex reduction. The
    # output stays organized — width/height shrink to (W/N, H/N).
    pixel_stride:             10

    # ---- K-frame accumulation ----
    # Most recent K frames of (target-frame-transformed) point clouds
    # are kept in a FIFO buffer. Every callback publishes the union of
    # all buffered frames as a single PointCloud2 — the same physical
    # point appears up to K times if observed from K different frames.
    # This is the raw substrate the downstream Gaussian-boundary
    # correspondence + mesh extractor is designed to consume; this
    # node intentionally does NO fusion / smoothing / dedup itself.
    buffer_size_k:            10
